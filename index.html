<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons: keep the classic /favicon.ico that Google's crawler probes
         first, plus PNG variants for browsers/devices. Order matters — smaller
         rel="icon" before apple-touch-icon so device pickers grab the right one. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://community.tucokids.com/" />
    <title>tuco Parents Circle — Parenting Community for Indian Parents</title>
    <meta name="description" content="A safe, anonymous community for Indian parents to discuss skincare, school, kids health, parenting hacks and more." />
    <!-- OG + Twitter cards. Include the logo as the fallback share image so
         WhatsApp / Twitter / LinkedIn previews aren't blank. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="tuco Parents Circle" />
    <meta property="og:title" content="tuco Parents Circle — Parenting Community for Indian Parents" />
    <meta property="og:description" content="A safe, anonymous community for Indian parents to discuss skincare, school, kids health, parenting hacks and more." />
    <meta property="og:url" content="https://community.tucokids.com/" />
    <meta property="og:image" content="https://community.tucokids.com/favicon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://community.tucokids.com/favicon-512.png" />
    <meta name="twitter:title" content="tuco Parents Circle" />
    <meta name="twitter:description" content="A safe, anonymous community for Indian parents." />
    <!-- Organization schema — Google reads the logo field to decide which
         favicon to show next to your site in search results. Without this it
         falls back to a generic globe. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "tuco Parents Circle",
      "alternateName": "tuco Kids",
      "url": "https://community.tucokids.com",
      "logo": "https://community.tucokids.com/favicon-512.png",
      "sameAs": ["https://tucokids.com"]
    }
    </script>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X9P5L4CF0R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-X9P5L4CF0R');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://app.sagepilot.ai/chat-widget.js" id="widget" onload="window.ChatWidget.init({ host: 'https://app.sagepilot.ai', key: '9eef7e32-9801-40aa-a454-f852fea4a511:c8830617-338e-4af5-81b2-39317cc29ebc', bottomPadding: 100 })"></script>
  </body>
</html>
